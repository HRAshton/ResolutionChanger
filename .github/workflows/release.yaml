name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to validate and publish.
        required: true
        type: string

permissions: {}

jobs:
  prepare-release:
    name: Validate release reference
    runs-on: ubuntu-24.04
    outputs:
      source-ref: ${{ steps.reference.outputs.source-ref }}
      release-tag: ${{ steps.reference.outputs.release-tag }}

    steps:
      - id: reference
        name: Resolve release tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^v ]]; then
              echo "::error::The release tag must start with v."
              exit 1
            fi

            echo "source-ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "release-tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "source-ref=$PUSH_SHA" >> "$GITHUB_OUTPUT"
          echo "release-tag=$PUSH_TAG" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release candidate
    needs: prepare-release
    uses: ./.github/workflows/validate.yaml
    with:
      source-ref: ${{ needs.prepare-release.outputs.source-ref }}

  publish:
    name: Publish release
    needs:
      - prepare-release
      - validate
    runs-on: windows-2025
    environment: release

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.source-ref }}

      - name: Install .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: ResolutionChanger/ResolutionChanger.csproj

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore ResolutionChanger.slnx --runtime win-x64

      - name: Publish
        run: >-
          dotnet publish ResolutionChanger/ResolutionChanger.csproj
          --configuration Release
          --no-restore
          --output dist/publish
          -p:ContinuousIntegrationBuild=true

      - name: Create executable checksum
        shell: pwsh
        run: |
          $executable = "dist/publish/ResolutionChanger.exe"
          $hash = (Get-FileHash $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *ResolutionChanger.exe" |
            Set-Content -Encoding ascii "$executable.sha256"

      - name: Attest release artifact
        uses: actions/attest@v1.0.0
        with:
          subject-path: dist/publish/ResolutionChanger.exe

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release-tag }}
        run: >-
          gh release create "$env:RELEASE_TAG"
          dist/publish/ResolutionChanger.exe
          dist/publish/ResolutionChanger.exe.sha256
          --verify-tag
          --generate-notes
          --draft
